name: Update Shinylive app

on:
  push:
    paths:
      - Report16.rds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install shinylive
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::tidyr
            any::dplyr
            any::readr
            any::stringr
            any::lubridate
            any::DT
            any::plotly

      - name: Export Shinylive app
        run: Rscript -e 'shinylive::export(".", "./docs")'

      - name: Commit updated app
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Shinylive app from Report16.rds
          file_pattern: docs/